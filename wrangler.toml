# ============================================
# Cloudflare Pages + OpenNext Configuration
# ============================================
# Untuk Cloudflare Pages via Git integration.
# Build settings (build command, output dir) diatur di dashboard.
# ============================================

name = "mebel-online"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
pages_build_output_dir = ".open-next/assets"

# ============================================
# Environment Variables (Production)
# ============================================
# Variabel di-set via Cloudflare Dashboard > Pages > Settings > Environment Variables
#
# Daftar variabel yang diperlukan:
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#   AUTH_SECRET
#   AUTH_URL
#   RESEND_API_KEY
#   RESEND_FROM_EMAIL
#   NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET (opsional, default: "furniture-images")