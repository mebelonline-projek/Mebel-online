# ============================================
# Cloudflare Pages + OpenNext Configuration
# ============================================
# Dokumentasi: https://opennextjs.org/cloudflare
# ============================================

name = "mebel-online"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

# ============================================
# Assets — static files dari Next.js build
# ============================================
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ============================================
# Build command — menggunakan OpenNext adapter
# ============================================
[build]
command = "npm run build"

# ============================================
# Environment Variables (Production)
# ============================================
# Variabel di bawah ini harus di-set via:
#   wrangler secret put <KEY>
# atau via Cloudflare Dashboard > Pages > Settings > Environment Variables
#
# Daftar variabel yang diperlukan:
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#   AUTH_SECRET
#   AUTH_URL
#   RESEND_API_KEY
#   RESEND_FROM_EMAIL
#   NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET (opsional, default: "furniture-images")

# ============================================
# Preview Environment (Branch deployments)
# ============================================
[env.preview]
name = "mebel-online-preview"

# ============================================
# D1 Database (TIDAK DIGUNAKAN — tetap pakai Supabase)
# ============================================
# Jika nanti migrasi dari Supabase ke D1, uncomment baris di bawah:
# [[d1_databases]]
# binding = "DB"
# database_name = "mebel-online-db"
# database_id = "YOUR_D1_DATABASE_ID"