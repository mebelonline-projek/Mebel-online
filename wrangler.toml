# ============================================
# Cloudflare Workers + OpenNext Configuration
# ============================================
# Deploy sebagai Cloudflare Worker (bukan Pages)
# ============================================

name = "mebel-online"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
workers_dev = true

# ============================================
# Assets — static files dari Next.js build
# ============================================
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ============================================
# Environment Variables (Production)
# ============================================
# Variabel di-set via:
#   wrangler secret put <KEY>
# atau via Cloudflare Dashboard > Workers > Settings > Variables
#
# Daftar variabel yang diperlukan:
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#   AUTH_SECRET
#   AUTH_URL
#   RESEND_API_KEY
#   RESEND_FROM_EMAIL
#   NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET (opsional, default: "furniture-images")